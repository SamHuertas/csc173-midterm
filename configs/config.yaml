# do not change after training starts or after baseline.csv is written.
seed: 42
 
data:
  url: https://raw.githubusercontent.com/allenai/scitldr/master/SciTLDR-Data/SciTLDR-A
  sizes: {train: 1992, test: 618}
  max_source_len: 512     # abstract tokens kept
  max_target_len: 64      # TLDR tokens kept
 
train:
  model: facebook/bart-base
  epochs: 5
  lr: 3.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  effective_batch: 16     # per-device batch x gradient accumulation, the same on every machine
 
baseline:
  batch_size: 16          # speed only
  decoding:               # the one fixed decoding method for all 618 summaries
    num_beams: 1          
    do_sample: false
    max_new_tokens: 64
    no_repeat_ngram_size: 3   # never repeat a 3-word sequence (this is the model's default; stated here on purpose)